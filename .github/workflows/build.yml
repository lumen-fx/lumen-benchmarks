# Compile check for every framework's benchmark app, plus the harness's own
# statistics tests.
#
# This does not measure anything: no display, no compositor, no timing. It only
# confirms that each framework's app still builds, that the statistics helpers
# behave on synthetic data, and that the report generator still renders the
# committed results.json. Each framework is its own matrix job; fail-fast is
# off so one framework breaking or missing does not hide the others.
#
# The lumen job builds lumenc from the framework repo; the benchmark apps
# themselves are .lmn markup with nothing to compile.

name: build

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Harness statistics and report generator: pure Python, no display and no
  # measurement.
  harness:
    name: harness
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3'

      - name: Run the statistics tests
        run: python3 harness/test_stats.py

      - name: Render the committed results with the report generator
        env:
          BENCH_RESULTS_JSON: results.json
          BENCH_RESULTS_MD: ${{ runner.temp }}/results.md
        run: |
          python3 harness/bench.py report
          test -s "$BENCH_RESULTS_MD"

      - name: Confirm the recorded results were not rewritten
        run: git diff --exit-code

  build:
    name: ${{ matrix.framework }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: egui
            kind: rust
            dir: egui
          - framework: iced
            kind: rust
            dir: iced
          - framework: slint
            kind: rust
            dir: slint
          - framework: tauri
            kind: rust-tauri
            dir: tauri/src-tauri
          - framework: qt-widgets
            kind: cmake-qt
          - framework: gtk4
            kind: cmake-gtk
          - framework: flutter
            kind: flutter
          - framework: lumen
            kind: lumen
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Lumen: build lumenc from the framework repo. The benchmark apps are
      # .lmn markup and compile inside lumenc at run time.
      - name: Check out the Lumen framework repository
        if: matrix.kind == 'lumen'
        uses: actions/checkout@v4
        with:
          repository: lumen-fx/lumen
          path: lumen-framework

      - name: Install Lumen system dependencies
        if: matrix.kind == 'lumen'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libasound2-dev \
            libxdo-dev \
            pkg-config

      - name: Install the Rust toolchain for Lumen
        if: matrix.kind == 'lumen'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build artifacts for Lumen
        if: matrix.kind == 'lumen'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: lumen-framework

      - name: Build lumenc
        if: matrix.kind == 'lumen'
        working-directory: lumen-framework
        run: cargo build -p lumenc

      # System packages per framework.
      - name: Install Tauri system dependencies
        if: matrix.kind == 'rust-tauri'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config

      - name: Install Qt system dependencies
        if: matrix.kind == 'cmake-qt'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev \
            cmake \
            ninja-build \
            g++ \
            libgl1-mesa-dev

      - name: Install GTK4 system dependencies
        if: matrix.kind == 'cmake-gtk'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev \
            cmake \
            ninja-build \
            gcc \
            pkg-config

      - name: Install Flutter Linux dependencies
        if: matrix.kind == 'flutter'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev

      # Slint's font stack links against fontconfig.
      - name: Install Slint system dependencies
        if: matrix.framework == 'slint'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev \
            pkg-config

      # Rust toolchain + cache for the Rust frameworks.
      - name: Install the Rust toolchain
        if: matrix.kind == 'rust' || matrix.kind == 'rust-tauri'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build artifacts
        if: matrix.kind == 'rust' || matrix.kind == 'rust-tauri'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.dir }}

      - name: Build the Rust app
        if: matrix.kind == 'rust' || matrix.kind == 'rust-tauri'
        working-directory: ${{ matrix.dir }}
        run: cargo build --all-targets

      # CMake frameworks (Qt Widgets, GTK4).
      - name: Configure and build with CMake
        if: matrix.kind == 'cmake-qt' || matrix.kind == 'cmake-gtk'
        run: |
          cmake -S ${{ matrix.framework }} -B ${{ matrix.framework }}/build -G Ninja
          cmake --build ${{ matrix.framework }}/build

      # Flutter Linux desktop build.
      - name: Install Flutter
        if: matrix.kind == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build the Flutter Linux app
        if: matrix.kind == 'flutter'
        working-directory: flutter
        run: |
          flutter config --enable-linux-desktop
          flutter pub get
          flutter build linux --debug
