[package]
name = "bench-tauri"
version = "0.1.0"
edition = "2021"
description = "Cross-framework GUI benchmark - Tauri (system webkit2gtk) variant"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "bench-tauri"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = false
